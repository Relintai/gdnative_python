
  macos-build:
    name: '🍎 macOS build'
    runs-on: macos-15
    env:
      CC: clang
      PLATFORM: 'osx-64'
    steps:
      - name: 'Checkout'
        uses: actions/checkout@f1d3225b5376a0791fdee5a0e8eac5289355e43a  # pin@v2
        with:
            submodules: true
      - name: 'Set up Python'
        uses: actions/setup-python@0291cefc54fa79cd1986aee8fa5ecb89ad4defea  # pin@v2
        with:
            python-version: ${{ env.PYTHON_VERSION }}
      - name: 'Setup venv'
        run: |
          set -eux
          ${{ env.CC }} --version
          python --version
          brew update
          brew install zlib openssl
          brew install --cask xquartz
          pip install -U pip
          pip install -r requirements.txt
          # Configuration for scons
          echo 'pandemonium_binary = "${{ env.PANDEMONIUM_BINARY_VERSION }}"' >> custom.py
          echo 'platform = "${{ env.PLATFORM }}"' >> custom.py
          echo 'CC = "${{ env.CC }}"' >> custom.py
      - name: 'Build project'
        run: |
          set -eux
          scons build -j2
#      - name: 'Run tests'
#        run: |
#          set -eux
#          scons tests
      - name: 'Generate artifact archive'
        run: |
          set -eux
          scons release
      - name: 'Export release artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLATFORM }}-release
          path: 'build/pandemonium-python-*.zip'


#################################################################################


  publish-release:
    name: 'Publish release'
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    needs:
      - linux-build
      - windows-build
      - macos-build
    strategy:
      matrix:
        include:
          - PLATFORM: x11-64
          - PLATFORM: windows-64
          - PLATFORM: windows-32
          - PLATFORM: osx-64
    steps:
      - uses: actions/download-artifact@v4
        name: ${{ matrix.PLATFORM }}-release
      - name: 'Upload release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: pandemonium-python-*.*
          file_glob: true
          overwrite: true
